<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;   /* vertical center */
      align-items: center;       /* horizontal center */
      text-align: center;
      background-image: url("http://whatsupinwindsor.pythonanywhere.com/static/construction.jpeg");
      background-size: cover;        /* fill screen */
      background-position: left center;   /* center image on desktop, left on mobile*/
      background-repeat: no-repeat;
    }

    a {
      font-size: 1.2rem;
      color: white;
      text-decoration: underline;
    }

    mark {
        background-color: black;
        color: white;
    }
  </style>
</head>
<body>
  <h1><mark>Under Construction</mark></h1>
  <a href="/2024"><mark>Go to old site</mark></a>
</body>
</html>
